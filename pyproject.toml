# 开发工具配置（项目依赖见 requirements.txt）

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # jieba 0.42.1 源码里的正则字符串会触发转义序列警告（3.11 是 DeprecationWarning，
    # 3.12+ 是 SyntaxWarning），与本项目代码无关
    "ignore:invalid escape sequence:DeprecationWarning",
    "ignore:invalid escape sequence:SyntaxWarning",
    # 环境里装有 setuptools 时（如 GitHub 托管的 Python 3.11），jieba 会导入已弃用的 pkg_resources；
    # 不同 setuptools 版本发出的警告类别不同（DeprecationWarning / UserWarning），这里按消息统一忽略
    "ignore:pkg_resources is deprecated as an API",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
